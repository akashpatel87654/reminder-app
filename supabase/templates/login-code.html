<body style="margin:0;padding:0;background:#F4F0E6">
<!-- SubTrack sign-in code. Used for both "Magic Link" and "Confirm signup" (first sign-in) templates. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F0E6">
<tr><td align="center" style="padding:24px 14px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:2.5px solid #141414;border-radius:22px;box-shadow:5px 5px 0 #141414">
<tr><td style="background:#C6F432;border-bottom:2.5px solid #141414;border-radius:20px 20px 0 0;padding:12px 18px;font-family:'Bricolage Grotesque',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:800;color:#141414">
<span style="display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:#141414;color:#C6F432;font-size:15px">S</span>&nbsp; SubTrack
</td></tr>
<tr><td style="padding:24px 18px;font-family:'Bricolage Grotesque',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#141414">
<div style="font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-0.8px">your sign-in code 📬</div>
<p style="margin:12px 0 0;font-size:15px;line-height:1.45;font-weight:500">type this in the app. it expires in an hour.</p>
<div style="margin:20px 0 0;padding:14px 0;text-align:center;background:#C6F432;border:2.5px solid #141414;border-radius:16px;font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:34px;letter-spacing:10px;color:#141414">{{ .Token }}</div>
<p style="margin:18px 0 0;font-size:13px;line-height:1.45;font-weight:500">didn’t ask for this? ignore it. no one gets in without the code.</p>
</td></tr>
<tr><td style="padding:14px 18px;background:#FFF8EC;border-top:2.5px solid #141414;border-radius:0 0 20px 20px;font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#141414">no passwords. ever. ✌︎ · SubTrack</td></tr>
</table>
</td></tr>
</table>
